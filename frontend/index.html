<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Bread Predictor 🍌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'banana-bg': '#fcfbf4',
                        'banana-brown': '#5c4b18',
                        'banana-yellow': '#ebd855',
                        'banana-yellow-hover': '#dcca4b',
                        'banana-light': '#fffde7',
                        'status-ready-bg': '#d4edda',
                        'status-ready-text': '#155724',
                        'status-wait-bg': '#fff3cd',
                        'status-wait-text': '#856404',
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .drag-active { background-color: #fffde7; border-color: #5c4b18; }
    </style>
</head>
<body class="bg-banana-bg min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-banana-brown mb-2">Are they ready? 🍌</h1>
        <p class="text-gray-500 mb-6">Upload a photo to check if your bananas are ready for bread.</p>

        <!-- Hidden Input -->
        <input type="file" id="file-input" class="hidden" accept="image/*">

        <!-- Upload Zone (Drag & Drop) -->
        <div id="drop-zone" class="border-2 border-dashed border-banana-yellow bg-white rounded-xl p-8 mb-6 cursor-pointer transition-all hover:bg-banana-light group">
            <div id="placeholder-content">
                <p class="text-gray-400 group-hover:text-banana-brown transition-colors">
                    Click or Drag & Drop Image Here
                </p>
            </div>
            <!-- Preview Image -->
            <img id="preview-image" class="w-full h-48 object-cover rounded-lg shadow-sm mx-auto hidden mt-2" src="" alt="Preview">
        </div>

        <!-- Analyze Button -->
        <button id="predict-btn" class="w-full bg-banana-yellow hover:bg-banana-yellow-hover text-banana-brown font-bold py-3 rounded-lg transition-transform active:scale-95 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed hidden">
            Check Ripeness
        </button>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden mt-6">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-banana-brown mx-auto"></div>
            <p class="text-sm text-gray-500 mt-2">Consulting the neural network...</p>
        </div>

        <!-- Result Box -->
        <div id="result" class="hidden mt-6 p-4 rounded-lg border">
            <p id="status-title" class="font-bold text-lg mb-1">--</p>
            <p id="days-text" class="text-sm">--</p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // ⚠️ REPLACE THIS with your actual Google Cloud Run URL!
        // Example: "https://banana-api-x72j3.a.run.app"
        const API_URL = "https://banana-api-593459230310.europe-west2.run.app"; 

        // --- ELEMENTS ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewImage = document.getElementById('preview-image');
        const placeholderContent = document.getElementById('placeholder-content');
        const predictBtn = document.getElementById('predict-btn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const statusTitle = document.getElementById('status-title');
        const daysText = document.getElementById('days-text');

        let selectedFile = null;

        // --- EVENT LISTENERS ---

        // 1. Click to Upload
        dropZone.addEventListener('click', () => fileInput.click());

        // 2. Handle File Selection (Click)
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // 3. Drag & Drop Support
        dropZone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            dropZone.classList.add('drag-active'); 
        });
        
        dropZone.addEventListener('dragleave', () => { 
            dropZone.classList.remove('drag-active'); 
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            handleFile(e.dataTransfer.files[0]);
        });

        // 4. File Processing Logic
        function handleFile(file) {
            if (!file) return;
            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                // Show Preview
                previewImage.src = e.target.result;
                previewImage.classList.remove('hidden');
                placeholderContent.classList.add('hidden'); // Hide the "Click to upload" text
                
                // Show Button, Hide previous results
                predictBtn.classList.remove('hidden');
                result.classList.add('hidden');
                loading.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 5. Prediction Logic
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // UI Loading State
            loading.classList.remove('hidden');
            predictBtn.classList.add('hidden');
            result.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // Ensure the URL ends with /predict
                // Fallback to localhost if API_URL is still placeholder
                let baseUrl = API_URL.includes("YOUR_GOOGLE_CLOUD") ? "http://localhost:8000" : API_URL;
                const endpoint = baseUrl.endsWith('/') ? `${baseUrl}predict` : `${baseUrl}/predict`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) throw new Error(data.error);

                // --- UPDATE UI BASED ON RESULT ---
                result.classList.remove('hidden');
                
                // Determine styling based on status
                const isReady = data.status.toLowerCase().includes("ready");
                
                if (isReady) {
                    result.className = "mt-6 p-4 rounded-lg border bg-status-ready-bg border-green-200 text-status-ready-text";
                } else {
                    result.className = "mt-6 p-4 rounded-lg border bg-status-wait-bg border-yellow-200 text-status-wait-text";
                }

                statusTitle.innerText = data.status;
                daysText.innerText = `Prediction: ${data.prediction_days} days left`;

            } catch (error) {
                result.classList.remove('hidden');
                result.className = "mt-6 p-4 rounded-lg border bg-red-100 border-red-200 text-red-700";
                statusTitle.innerText = "Error";
                daysText.innerText = "Could not connect to the API. Check console for details.";
                console.error("API Error:", error);
            } finally {
                loading.classList.add('hidden');
                predictBtn.classList.remove('hidden');
                predictBtn.innerText = "Check Another Banana";
            }
        });
    </script>
</body>
</html>
