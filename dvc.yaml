stages:
  prepare:
    cmd: python src/prepare_data.py
    deps:
      - src/prepare_data.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python src/train_v3.py
    deps:
      - src/train_v3.py
      - data/processed
    outs:
      - models/candidate_model.keras
    metrics:
      - reports/train_metrics.json:
          cache: false

  promote:
    cmd: python src/promote_model.py
    deps:
      - src/promote_model.py
      - models/candidate_model.keras
      - reports/train_metrics.json
    outs:
      - models/banana_mobilenet.keras
    metrics:
      - reports/production_metrics.json:
          cache: false

# The Magic Command: `dvc repro`
