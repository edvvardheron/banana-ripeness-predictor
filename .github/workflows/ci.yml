name: Banana CI (Quality Gate)

# Trigger: Run on every push to main or pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code
    - uses: actions/checkout@v3

    # 2. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install Dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx # Install test tools

    # 4. Linting (Optional but recommended)
    # Checks for messy code / syntax errors
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. Run Tests
    # Note: We run pytest. If this fails, the Commit gets a Red X.
    - name: Run Unit Tests
      run: |
        pytest tests/
