name: Banana Drift Check & Auto-Retrain

# Trigger: scheduled check for data drift, plus manual runs
on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '<SERVICE_ACCOUNT_EMAIL>'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]"

      - name: Pull data and model from DVC remote
        run: |
          dvc pull
          # Best-effort: only does something if data/incoming is DVC-tracked.
          # To wire up live drift checks, add incoming production images with:
          #   dvc add data/incoming && dvc push
          dvc pull data/incoming || true

      - name: Run drift detection
        id: drift
        continue-on-error: true
        run: python src/detect_drift.py

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/
          if-no-files-found: ignore

      - name: Retrain and promote (only if drift was detected)
        if: steps.drift.outcome == 'failure'
        id: retrain
        run: |
          # --force on these two stages: the drift signal comes from
          # data/incoming, which the "prepare" stage's deps don't see,
          # so DVC would otherwise consider train/promote already up to date.
          dvc repro --force train promote
          dvc push

      - name: Open PR with retrained model (only if drift was detected)
        if: steps.drift.outcome == 'failure'
        run: |
          DRIFT_SCORE=$(python -c "import json; print(json.load(open('reports/drift_report.json'))['drift_score'])")
          PROMOTED=$(python -c "import json; print(json.load(open('reports/promotion_result.json'))['promoted'])")
          CANDIDATE_MAE=$(python -c "import json; print(json.load(open('reports/promotion_result.json'))['candidate_mae'])")
          REASON=$(python -c "import json; print(json.load(open('reports/promotion_result.json'))['reason'])")

          BRANCH="auto-retrain/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock reports/train_metrics.json reports/production_metrics.json
          git commit -m "Auto-retrain triggered by drift detection (score: $DRIFT_SCORE)"
          git push origin "$BRANCH"

          gh label create "automated-retrain" --color ededed \
            --description "Opened automatically by the drift-check workflow" || true

          gh pr create \
            --title "Auto-retrain: drift detected (score $DRIFT_SCORE)" \
            --body "Scheduled drift check found the incoming data had drifted past the threshold.

          - Drift score: $DRIFT_SCORE
          - Retrained candidate MAE: $CANDIDATE_MAE
          - Promotion gate result: **$REASON** (promoted=$PROMOTED)

          Review the updated \`dvc.lock\` and metrics before merging. Merging this PR does not deploy anything by itself — CD still builds from whatever \`models/banana_mobilenet.keras\` resolves to via \`dvc pull\` on the next push to main." \
            --label "automated-retrain"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
